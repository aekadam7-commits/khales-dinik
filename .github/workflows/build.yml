name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: فك ضغط app.zip
        run: |
          unzip -o app.zip -d app
          ls -la app

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: تثبيت وإضافة أندرويد
        working-directory: app
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: بناء APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: تسمية الـ APK
        run: cp app/android/app/build/outputs/apk/debug/app-debug.apk masrouf.apk

      - uses: actions/upload-artifact@v4
        with:
          name: masrouf-apk
          path: masrouf.apk

      - name: إنشاء Release تلقائياً
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: مصروفي v${{ github.run_number }}
          body: نسخة جديدة من التطبيق. حمّل الملف masrouf.apk وثبّته على هاتفك.
          files: masrouf.apk
